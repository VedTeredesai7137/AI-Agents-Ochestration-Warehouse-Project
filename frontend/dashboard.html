<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SwarmOS</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/dashboard.css') }}?v=black-dashboard-2"
    >
</head>

<body>

    <header class="header">

        <h1>
            SwarmOS
        </h1>

        <nav aria-label="Operations pages">
            <a href="/OperationCenter"><span class="nav-index">01</span><span class="nav-label">Operations</span></a>
            <a href="/CrisisOrchestration"><span class="nav-index">02</span><span class="nav-label">Crisis</span></a>
            <a href="/AgentAnalytics"><span class="nav-index">03</span><span class="nav-label">Analytics</span></a>
            <a href="/dashboard" aria-current="page"><span class="nav-index">04</span><span class="nav-label">Dashboard</span></a>
        <a href="/SystemOverview"><span class="nav-index">05</span><span class="nav-label">Overview</span></a>
        <a href="/DeveloperCentre"><span class="nav-index">06</span><span class="nav-label">Developer</span></a>
        </nav>

    </header>


    <div
        id="system-alert-banner"
        style="display: none;"
    ></div>


    <div class="layout">

        <main class="main">


            <!-- ======================================================
                 TOP CONTROL AREA
                 Simulation Status | Legend | Controls
                 ====================================================== -->

            <section
                class="top-control-bar"
                aria-label="Simulation status, legend and controls"
            >


                <!-- ==========================
                     SIMULATION STATUS
                     ========================== -->

                <section class="toolbar-group status-group">

                    <div class="toolbar-heading">
                        Simulation Status
                    </div>

                    <div class="status-strip">

                        <div class="stat-row">
                            <span class="stat-label">
                                Step
                            </span>

                            <span
                                class="stat-value"
                                id="stat-step"
                            >
                                0
                            </span>
                        </div>


                        <div class="stat-row">
                            <span class="stat-label">
                                Active Robots
                            </span>

                            <span
                                class="stat-value"
                                id="stat-active"
                            >
                                0
                            </span>
                        </div>


                        <div class="stat-row">
                            <span class="stat-label">
                                Total Tasks
                            </span>

                            <span
                                class="stat-value"
                                id="stat-total-tasks"
                            >
                                0
                            </span>
                        </div>


                        <div class="stat-row">
                            <span class="stat-label">
                                Unfinished
                            </span>

                            <span
                                class="stat-value"
                                id="stat-unfinished"
                            >
                                0
                            </span>
                        </div>


                        <div class="stat-row">
                            <span class="stat-label">
                                Running
                            </span>

                            <span
                                class="stat-value paused"
                                id="stat-running"
                            >
                                PAUSED
                            </span>
                        </div>

                    </div>

                </section>


                <!-- ==========================
                     LEGEND
                     ========================== -->

                <section class="toolbar-group legend-group">

                    <div class="toolbar-heading">
                        Legend
                    </div>

                    <div class="legend-items">


                        <div class="legend-item">

                            <div
                                class="legend-swatch"
                                style="background: var(--accent-blue);"
                            ></div>

                            Robot

                        </div>


                        <div class="legend-item">

                            <div
                                class="legend-swatch"
                                style="background: var(--accent-orange);"
                            ></div>

                            Task Pickup

                        </div>


                        <div class="legend-item">

                            <div
                                class="legend-swatch"
                                style="background: var(--accent-green);"
                            ></div>

                            Task Delivery

                        </div>


                        <div class="legend-item">

                            <div
                                class="legend-swatch"
                                style="background: var(--accent-yellow);"
                            ></div>

                            Charging Station

                        </div>


                        <div class="legend-item">

                            <div
                                class="legend-swatch"
                                style="
                                    background: var(--shelf-color);
                                    border: 1px solid #4a4565;
                                "
                            ></div>

                            Shelf

                        </div>


                        <div class="legend-item">

                            <div
                                class="legend-swatch"
                                style="background: var(--bg-cell);"
                            ></div>

                            Aisle

                        </div>


                    </div>

                </section>


                <!-- ==========================
                     CONTROLS
                     ========================== -->

                <section class="toolbar-group action-group">

                    <div class="toolbar-heading">
                        Controls
                    </div>

                    <div class="controls">


                        <button
                            class="btn btn-start"
                            onclick="apiPost('/simulation/start')"
                        >
                            ▶ Start
                        </button>


                        <button
                            class="btn btn-pause"
                            onclick="apiPost('/simulation/pause')"
                        >
                            ⏸ Pause
                        </button>


                        <button
                            class="btn btn-step"
                            onclick="apiPost('/simulation/step')"
                        >
                            ⏭ Step
                        </button>


                        <button
                            class="btn btn-reset"
                            onclick="apiPost('/simulation/reset')"
                        >
                            ↺ Reset
                        </button>


                    </div>

                </section>


            </section>


            <!-- ======================================================
                 WAREHOUSE
                 ====================================================== -->

            <section class="card warehouse-card">

                <div
                    class="card-title"
                    id="grid-title"
                >
                    Warehouse Grid
                </div>


                <div class="grid-wrapper">

                    <div
                        style="
                            position: relative;
                            display: inline-block;
                        "
                    >

                        <svg
                            id="path-overlay"
                            style="
                                position: absolute;
                                top: 0;
                                left: 0;
                                pointer-events: none;
                                z-index: 5;
                            "
                        ></svg>


                        <div
                            class="grid-container"
                            id="grid"
                        ></div>


                    </div>

                </div>

            </section>


            <!-- ======================================================
                 AGENT DIAGNOSTICS
                 ====================================================== -->

            <section
                class="card"
                id="agent-diagnostics"
                style="display: none;"
            >

                <div class="card-title">

                    Agent Diagnostics:

                    <span id="diag-robot-id"></span>

                </div>


                <div class="stat-row">

                    <span class="stat-label">
                        Goal
                    </span>

                    <span
                        class="stat-value"
                        id="diag-goal"
                    ></span>

                </div>


                <div class="stat-row">

                    <span class="stat-label">
                        Memory Size
                    </span>

                    <span
                        class="stat-value"
                        id="diag-memory"
                    ></span>

                </div>


                <div
                    class="stat-row"
                    style="
                        flex-direction: column;
                        align-items: flex-start;
                        gap: 8px;
                        border-bottom: none;
                    "
                >

                    <span class="stat-label">
                        Beliefs
                    </span>


                    <pre
                        id="diag-beliefs"
                        style="
                            font-size: 10px;
                            color: var(--accent-blue);
                            background: var(--bg-cell);
                            padding: 8px;
                            border-radius: 4px;
                            width: 100%;
                            white-space: pre-wrap;
                            overflow-wrap: break-word;
                            margin: 0;
                        "
                    ></pre>

                </div>


            </section>


        </main>

    </div>


    <script src="{{ url_for('static', path='js/dashboard.js') }}"></script>

</body>

</html>
